name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore Kkhay.sln

      - name: Build
        run: dotnet build Kkhay.sln --no-restore

      - name: Test
        run: dotnet test tests/Kkhay.Tests.csproj --no-build --verbosity normal


