name: Publish to NuGet

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: NuGet login via Trusted Publishing
        id: login
        uses: NuGet/login@v1
        with:
          user: boboaungdev

      - name: Build and Pack
        run: dotnet pack Kkhay.csproj --configuration Release -o out

      - name: Push to NuGet
        env:
          LOGIN_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          SECRET_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          API_KEY="${LOGIN_KEY:-$SECRET_KEY}"
          dotnet nuget push out/*.nupkg --api-key "$API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate


