name: Publish to NuGet

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build and Pack
        run: dotnet pack Kkhay.csproj --configuration Release -o out

      - name: NuGet login via OIDC Trusted Publishing (Secretless)
        id: login
        uses: NuGet/login@v1
        with:
          user: boboaungdev

      - name: Push to NuGet
        run: dotnet nuget push out/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Upload nupkg artifact (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: Kkhay-nupkg
          path: out/*.nupkg
